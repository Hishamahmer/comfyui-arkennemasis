[project]
name = "comfyui-arkennemasis"
description = "Generate images with your ChatGPT subscription - no API key. Use your existing ChatGPT Plus login through the Codex CLI to run OpenAI gpt-image-2 (GPT Image 2) inside ComfyUI, billed to your ChatGPT plan instead of per image. Also includes fal.ai nodes - one node per model with a live price badge, a spending cap and a free recovery node: GPT Image 2 Edit, Nano Banana 2 Edit, Seedance 2.5 (text, image and reference to video), Sync lipsync 2/3/React-1, MiniMax H3 Max Lip Sync and VEED Fabric - and a one-command way to add any new fal model. Plus utility nodes for batch generation: shared image settings, run-N-of-M shot selection that never bills skipped branches, auto-numbered run folders, caption sidecars and reusable system prompts. One pack, one menu, many use cases - new providers and node types are added regularly, and each module loads independently so nothing breaks anything else. Keywords: ChatGPT, ChatGPT Plus, ChatGPT Image 2, ChatGPT image generator, Codex, Codex CLI, OpenAI, GPT-Image-2, GPT Image 2, gpt-image-2, GPT-5, fal, fal.ai, Seedance, lipsync, lip sync, Nano Banana, image generation, image edit, text to image, image to video, LoRA dataset, character LoRA, dataset generator."
version = "1.3.0"
license = { file = "LICENSE" }
dependencies = ["httpx"]

[project.urls]
Repository = "https://github.com/Hishamahmer/comfyui-arkennemasis"

