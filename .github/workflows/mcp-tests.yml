name: MCP tests

on:
  pull_request:
    paths:
      - "mcp_service/**"
      - "web/mcp/**"
      - "tests/mcp/**"
      - "__init__.py"
      - ".github/workflows/mcp-tests.yml"
  push:
    paths:
      - "mcp_service/**"
      - "web/mcp/**"
      - "tests/mcp/**"
      - "__init__.py"
      - ".github/workflows/mcp-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            mcp_service/requirements.txt
            mcp_service/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r mcp_service/requirements-dev.txt
      - name: Test MCP modules without a live ComfyUI or tunnel
        run: python -m unittest discover -s tests/mcp -v

  frontend:
    name: Browser bridge logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/mcp/frontend.test.cjs
